<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">拟合成功，参数就可信吗？</title><desc id="desc">Thermal Experiment Research：TCLab双加热器实测案例。示意图不是测量数据。</desc><rect width="1200" height="630" fill="#f7f7f2"/><path d="M64 96h1072M64 550h1072" stroke="#d8dedc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#182f3b"><text x="64" y="66" font-size="19" letter-spacing="2">THERMAL EXPERIMENT RESEARCH</text><text x="64" y="225" font-size="72" font-weight="700">拟合成功，</text><text x="64" y="323" font-size="72" font-weight="700">参数就可信吗？</text><text x="67" y="396" font-size="25" fill="#526571">TCLab 双加热器 · 公开实测案例</text><text x="67" y="470" font-size="20" fill="#245d78">100 / 300 秒窗口　→　参数信息　→　后续预测</text><text x="64" y="588" font-size="17" fill="#526571">可复算的研究记录，不是设备控制或工业放行。</text><text x="1060" y="588" font-size="17" fill="#526571">001</text></g><g transform="translate(866 175)"><rect width="250" height="300" fill="#fff" stroke="#d8dedc"/><path d="M0 0h250" stroke="#245d78" stroke-width="4"/><g font-family="Noto Sans CJK SC,sans-serif"><text x="22" y="47" font-size="15" fill="#526571">THE RECORD</text><text x="18" y="151" font-family="monospace" font-size="88" fill="#245d78">599</text><text x="24" y="200" font-size="18" fill="#526571">行记录 · 一条历史曲线</text><text x="24" y="263" font-size="17" fill="#a75031">拟合 ≠ 参数可信</text></g></g></svg>
